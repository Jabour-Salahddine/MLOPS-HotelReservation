<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Reservation Prediction </title>

  <!-- ✅ Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Optionnel : icônes Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <!-- Card principale -->
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4">

            <h2 class="text-center mb-4 text-primary">
              <i class="bi bi-building"></i> Hotel Reservation Prediction
            </h2>

            <form method="POST">

              <!-- Lead Time -->
              <div class="mb-3">
                <label for="lead_time" class="form-label">Lead Time</label>
                <input type="number" class="form-control" id="lead_time" name="lead_time" required>
              </div>

              <!-- Special Request -->
              <div class="mb-3">
                <label for="no_of_special_request" class="form-label">Number of Special Requests</label>
                <input type="number" class="form-control" id="no_of_special_request" name="no_of_special_request" required>
              </div>

              <!-- Average Price -->
              <div class="mb-3">
                <label for="avg_price_per_room" class="form-label">Average Price per Room</label>
                <input type="number" step="0.01" class="form-control" id="avg_price_per_room" name="avg_price_per_room" required>
              </div>

              <!-- Arrival Month -->
              <div class="mb-3">
                <label for="arrival_month" class="form-label">Arrival Month</label>
                <select class="form-select" id="arrival_month" name="arrival_month" required>
                  <option value="" disabled selected>Choose month...</option>
                  <option value="1">January</option>
                  <option value="2">February</option>
                  <option value="3">March</option>
                  <option value="4">April</option>
                  <option value="5">May</option>
                  <option value="6">June</option>
                  <option value="7">July</option>
                  <option value="8">August</option>
                  <option value="9">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>

              <!-- Arrival Date -->
              <div class="mb-3">
                <label for="arrival_date" class="form-label">Arrival Date</label>
                <select class="form-select" id="arrival_date" name="arrival_date" required>
                  <option value="" disabled selected>Choose day...</option>
                  {% for i in range(1, 32) %}
                  <option value="{{ i }}">{{ i }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Market Segment -->
              <div class="mb-3">
                <label for="market_segment_type" class="form-label">Market Segment Type</label>
                <select class="form-select" id="market_segment_type" name="market_segment_type" required>
                  <option value="0">Aviation</option>
                  <option value="1">Complimentary</option>
                  <option value="2">Corporate</option>
                  <option value="3">Offline</option>
                  <option value="4">Online</option>
                </select>
              </div>

              <!-- Week Nights -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="no_of_week_nights" class="form-label">No. of Week Nights</label>
                  <input type="number" class="form-control" id="no_of_week_nights" name="no_of_week_nights" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="no_of_weekend_nights" class="form-label">No. of Weekend Nights</label>
                  <input type="number" class="form-control" id="no_of_weekend_nights" name="no_of_weekend_nights" required>
                </div>
              </div>

              <!-- Meal Plan -->
              <div class="mb-3">
                <label for="type_of_meal_plan" class="form-label">Type of Meal Plan</label>
                <select class="form-select" id="type_of_meal_plan" name="type_of_meal_plan" required>
                  <option value="0">Meal Plan 1</option>
                  <option value="1">Meal Plan 2</option>
                  <option value="2">Meal Plan 3</option>
                  <option value="3">Not Selected</option>
                </select>
              </div>

              <!-- Room Type -->
              <div class="mb-4">
                <label for="room_type_reserved" class="form-label">Room Type Reserved</label>
                <select class="form-select" id="room_type_reserved" name="room_type_reserved" required>
                  <option value="0">Room Type 1</option>
                  <option value="1">Room Type 2</option>
                  <option value="2">Room Type 3</option>
                  <option value="3">Room Type 4</option>
                  <option value="4">Room Type 5</option>
                  <option value="5">Room Type 6</option>
                  <option value="6">Room Type 7</option>
                </select>
              </div>

              <!-- Submit button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="bi bi-robot"></i> Predict
                </button>
              </div>
            </form>

            <!-- Résultat -->
            {% if prediction is not none %}
            <div class="alert mt-4 {% if prediction == 0 %}alert-danger{% else %}alert-success{% endif %}" role="alert">
              {% if prediction == 0 %}
              <i class="bi bi-x-circle"></i> The customer <strong>will cancel</strong> their reservation.
              {% elif prediction == 1 %}
              <i class="bi bi-check-circle"></i> The customer <strong>will not cancel</strong> their reservation.
              {% endif %}
            </div>
            {% endif %}
          </div>
        </div>

        <p class="text-center mt-4 text-muted small">
          © 2025 Hotel Predictor App
        </p>

      </div>
    </div>
  </div>

  <!-- ✅ Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
